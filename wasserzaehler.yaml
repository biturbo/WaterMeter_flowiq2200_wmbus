# ESPHome config for a Kamstrup FlowIQ 2200 water meter read via ESP32 + CC1101.
# Ported from https://github.com/erikxson/watermeter-flowiq2200
#
# Folder layout (put both next to each other in your ESPHome config folder):
#   wasserzaehler.yaml
#   components/flowiq2200/...

esphome:
  name: flowiq2200-wmbus
  friendly_name: Water Meter

esp32:
  board: lolin_d32
  framework:
    type: arduino
    advanced:
      minimum_chip_revision: "3.0"
      sram1_as_iram: true
    
logger:
  level: DEBUG   # set to VERBOSE to see telegrams from other meters (useful to find your meter ID)

# Native Home Assistant API (replaces the original MQTT discovery).
# If you prefer MQTT, remove `api:` and add an `mqtt:` block instead - discovery is automatic.
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "flowIQ2200 Fallback"
    password: "fallback1234"

captive_portal:

external_components:
  - source:
      type: local
      path: components
    components: [flowiq2200]

# SPI bus (CS and GDO0 are set under flowiq2200: below)
spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

flowiq2200:
  cs_pin: GPIO27     # SPI Chip Select -> CC1101 CSN
  gdo0_pin: GPIO26   # Interrupt pin   -> CC1101 GDO0
  meter_id: !secret flowiq_meter_id # 8 digits, e.g. "12380878"
  key: !secret flowiq_aes_key # 32 hex characters
  
  # --- Readings ---
  volume:
    name: Usage
  month_start:
    name: Target Volume          # reading at the target (billing) date
  target_date:
    name: Target Date
  flow:
    name: Flow
  max_flow_last_day:
    name: Max Flow Last Day
  min_flow_last_day:
    name: Min Flow Last Day
  min_water_temperature_last_day:
    name: Min Water Temperature Last Day
  max_water_temperature_last_day:
    name: Max Water Temperature Last Day
  min_ambient_temperature_last_day:
    name: Min Ambient Temperature Last Day
  # max_ambient_temperature_last_day:   # not sent by every firmware
  #   name: Max Ambient Temperature Last Day

  # --- Status / alarms ---
  status:
    name: Status                 # "OK" or e.g. "LEAK LOW_BATTERY"
  leak:
    name: Leak
  burst:
    name: Burst
  dry:
    name: Dry
  reverse:
    name: Reverse Flow
  tamper:
    name: Tamper
  low_battery:
    name: Low Battery
  # ambient_temperature_alarm:
  #   name: Ambient Temperature Alarm
  # flow_above_q4:
  #   name: Flow Above Q4
  # no_consumption:
  #   name: No Consumption

  # --- How long each alarm has been active ("none", "1-8 hours", ... "22-31 days") ---
  time_leaking:
    name: Time Leaking
  time_bursting:
    name: Time Bursting
  time_dry:
    name: Time Dry
  time_reversed:
    name: Time Reversed
  # time_ambient_temperature:
  #   name: Time Ambient Temperature Alarm
  # time_flow_above_q4:
  #   name: Time Flow Above Q4
  # acoustic_noise:
  #   name: Acoustic Noise

  rssi:
    name: Meter RSSI

sensor:
  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 60s
  - platform: uptime
    name: Uptime

# Replaces watermeter/0/online
binary_sensor:
  - platform: status
    name: Online

# Replaces the watermeter/0/cmd/reset MQTT command
button:
  - platform: restart
    name: Restart
